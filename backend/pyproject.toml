[project]
name = "codeharness-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.7.28", "langchain-openai==1.7.2",
  "fastapi==0.146.0", "uvicorn==0.54.0", "langgraph-checkpoint-sqlite==3.1.2",
  "pywin32==312; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["ruff==0.17.1", "mypy==2.4.0", "pytest==9.1.1", "httpx==0.28.1",
  "pyinstaller==6.22.3", "psutil==7.2.2", "types-psutil", "types-pywin32"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
mypy_path = "backend"
exclude = ["build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
