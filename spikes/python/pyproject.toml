[project]
name = "codeharness-spikes"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.7.28", "langchain-openai==1.7.2", "langchain-anthropic==1.7.6",
  "fastapi==0.146.0", "uvicorn==0.54.0", "httpx==0.28.1", "pyinstaller==6.22.3", "psutil==7.2.2", "pywin32==312",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "types-psutil", "types-pywin32"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
exclude = ["build/", "dist/", "\\.spec$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
